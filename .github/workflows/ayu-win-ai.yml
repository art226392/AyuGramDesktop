name: AyuGram AI build (Windows x64)

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ayu-win-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 355

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      QT: qt6

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Caches are restored and saved explicitly, so that a first cold run
      # that hits the time limit still keeps the prepared libraries.
      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ayu-win-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ayu-win-x64-third-party-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ayu-win-x64-libs-${{ env.QT }}-${{ env.CACHE_KEY }}
          restore-keys: ayu-win-x64-libs-${{ env.QT }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent %QT%

      - name: Save ThirdParty cache.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ayu-win-x64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save Libraries cache.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ayu-win-x64-libs-${{ env.QT }}-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: AyuGram build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          %QT% ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Pack.
        shell: pwsh
        run: |
          $out = "$env:TBUILD\$env:REPO_NAME\out\Release"
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "$out\AyuGram.exe" artifact\
          if (Test-Path "$out\modules") { Copy-Item "$out\modules" artifact\ -Recurse }
          Compress-Archive -Path artifact\* -DestinationPath AyuGram-AI-win64.zip -Force

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: AyuGram-AI-win64
          path: AyuGram-AI-win64.zip
          retention-days: 7

      - name: Publish release.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-build
          name: AyuGram AI build
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Built from ${{ github.sha }} (${{ github.ref_name }})."
          files: AyuGram-AI-win64.zip
